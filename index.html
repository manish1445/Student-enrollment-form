<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Student Enrollment Form</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet"
              href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <script
        src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script
        src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    </head>
    <body>
        <div class="container">
            <h2>Student Enrollment Form</h2>
            <p id="status" class="text-muted">Loading script...</p>
            <form id="stuForm" method="post">
                <div class="form-group">
                    <label for="rollNo">Roll No:</label>
                    <input type="text" class="form-control" id="rollNo" name="rollNo"
                           placeholder="Enter Roll No" required>
                </div>
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input type="text" class="form-control" id="fullName" name="fullName"
                           placeholder="Enter Full Name">
                </div>
                <div class="form-group">
                    <label for="stuClass">Class:</label>
                    <input type="text" class="form-control" id="stuClass" name="stuClass"
                           placeholder="Enter Class">
                </div>
                <div class="form-group">
                    <label for="birthDate">Birth Date:</label>
                    <input type="date" class="form-control" id="birthDate" name="birthDate">
                </div>
                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" class="form-control" id="address" name="address"
                           placeholder="Enter Address">
                </div>
                <div class="form-group">
                    <label for="enrollDate">Enrollment Date:</label>
                    <input type="date" class="form-control" id="enrollDate" name="enrollDate">
                </div>
                <input type="button" class="btn btn-primary" id="saveBtn" value="Save"
                       onclick="saveStudent();">
                <input type="button" class="btn btn-success" id="updateBtn" value="Update"
                       onclick="updateStudent();">
                <input type="button" class="btn btn-default" id="resetBtn" value="Reset"
                       onclick="resetForm();">
            </form>
        </div>

        <script src="student.js"></script>
    </body>
</html>
